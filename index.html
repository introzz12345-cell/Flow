<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0f13" media="(prefers-color-scheme: dark)" />
    <title>Flow</title>

    <!-- Apply saved theme before first paint (prevents a white flash on dark devices) -->
    <script>
      (function () {
        var pref = null;
        try { pref = localStorage.getItem("flow-theme"); } catch (e) {}
        var root = document.documentElement;
        var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (pref === "light" || pref === "dark") {
          root.setAttribute("data-theme", pref);
          dark = pref === "dark";
        }
        root.setAttribute("data-resolved-theme", dark ? "dark" : "light");
      })();
    </script>

    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/theme.js" defer></script>
  </head>
  <body>
    <header class="app-header">
      <h1 class="app-title">Flow</h1>
      <button class="icon-btn" type="button" data-theme-toggle aria-label="สลับธีม">
        <!-- moon -->
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
        </svg>
        <!-- sun -->
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
        </svg>
      </button>
    </header>

    <main class="app-main">
      <section class="card" aria-labelledby="theme-heading">
        <h2 id="theme-heading">ธีม</h2>
        <p class="muted">"อัตโนมัติ" จะเปลี่ยนตามการตั้งค่าของเครื่อง</p>
        <div class="segmented" role="radiogroup" aria-labelledby="theme-heading">
          <button type="button" role="radio" data-theme-option="system" aria-checked="true">อัตโนมัติ</button>
          <button type="button" role="radio" data-theme-option="light" aria-checked="false">สว่าง</button>
          <button type="button" role="radio" data-theme-option="dark" aria-checked="false">มืด</button>
        </div>
      </section>

      <section class="card">
        <h2>ตัวอย่างหน้าจอ</h2>
        <p class="muted">ตัวอย่างสี การ์ด ช่องกรอก และปุ่มในทั้งสองธีม</p>
        <div class="field">
          <label for="sample-input">ช่องกรอกข้อความ</label>
          <input id="sample-input" class="input" type="text" placeholder="พิมพ์อะไรก็ได้…" />
        </div>
        <button class="btn" type="button">ปุ่มหลัก</button>
      </section>

      <section class="card">
        <h2>รายการ</h2>
        <ul class="list">
          <li>รายการที่ 1</li>
          <li>รายการที่ 2</li>
          <li>รายการที่ 3</li>
        </ul>
      </section>
    </main>
  </body>
</html>
